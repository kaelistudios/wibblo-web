<!--
  Página de descarga de Wibblo (/descargar/; /download/ lleva aquí).
  - Android: redirige a Google Play.
  - iPhone/iPad: redirige al App Store (Apple ID 6819557562).
  - Computadora o sin JavaScript: muestra los dos botones.
  Si la app deja de estar en el App Store, vaciar appStore en el script y
  volver a ocultar los botones .appstore: en iPhone se muestra entonces
  "Muy pronto en iPhone y iPad" con el botón de Google Play.
-->
<script>
  (function () {
    var html = document.documentElement;
    var langs = navigator.languages || [navigator.language || ''];
    for (var i = 0; i < langs.length; i++) {
      var l = String(langs[i]).toLowerCase();
      if (l.indexOf('es') === 0) break;
      if (l.indexOf('en') === 0) { html.className += ' lang-en'; html.lang = 'en'; break; }
    }
    var ua = navigator.userAgent || '';
    var android = /Android/i.test(ua);
    var ios = /iPhone|iPad|iPod/i.test(ua) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var play = 'https://play.google.com/store/apps/details?id=com.kaeli.wibblo';
    var appStore = 'https://apps.apple.com/app/id6819557562';
    if (android) { location.replace(play); return; }
    if (ios) {
      html.className += ' ios';
      if (appStore) { location.replace(appStore); return; }
      html.className += ' ios-soon';
    }
  })();
</script>
<style>
  :root { --text:#1f1f24; --muted:#5f6368; --accent:#2f6fd6; --bg:#ffffff; --card:#f6f8fb; --border:#e3e6eb; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height:1.5; }
  main { max-width:480px; margin:0 auto; padding:48px 16px 32px; text-align:center; }
  .icon { width:112px; height:112px; border-radius:26px; }
  h1 { font-size:2rem; margin:12px 0 4px; }
  .tagline { color:var(--muted); margin:0 0 28px; }
  .soon { display:none; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px 16px; margin:0 0 20px; font-weight:600; }
  .ios-soon .soon { display:block; }
  /* Insignias oficiales de Apple y Google, a la misma altura (guías de marca de cada tienda). */
  .stores { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:12px; }
  .store { display:inline-block; line-height:0; }
  .store img { height:56px; width:auto; }
  .store[hidden] { display:none; }
  .links { margin-top:32px; font-size:.9rem; }
  .links a { color:var(--accent); font-weight:600; text-decoration:none; margin:0 8px; }
  footer { text-align:center; color:var(--muted); font-size:.85rem; padding:0 16px 32px; }
  footer a { color:inherit; }
  #en { display:none; }
  .lang-en #es { display:none; }
  .lang-en #en { display:block; }
  #en:target { display:block; }
  main:has(#en:target) #es { display:none; }
  #es:target { display:block; }
  main:has(#es:target) #en { display:none; }
</style>
</head>
